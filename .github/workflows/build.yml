name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    # Matrix: prüft bei jedem Push, dass das Projekt auf allen drei Systemen kompiliert
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore
      - run: dotnet build --configuration Release --no-restore

  # Zweiter Wächter: Die Assets werden prozedural erzeugt: Bricht ein Generator, fällt es sonst
  # erst auf, wenn jemand die Assets neu baut.
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Alle Platzhalter-Assets erzeugen
        run: python tools/generate_placeholder_assets.py
      - name: Prüfen, dass Musik und Icons entstanden sind
        shell: bash
        run: |
          test -f src/CirclesOfAsh/Content/Audio/music_hub.wav
          test -f build/icons/CirclesOfAsh.ico
          test -f build/icons/CirclesOfAsh.icns
